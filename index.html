<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Air Canvas — draw in the air</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <!-- ================= TOP BAR ================= -->
  <header class="topbar glass">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span></div>
      <div class="brand-text">
        <h1>Air Canvas</h1>
        <p>Draw in the air · hand-tracked · no touch</p>
      </div>
    </div>

    <div class="status-cluster">
      <div class="pill" id="pillModel" data-state="loading">
        <span class="dot"></span>
        <span class="label">Model</span>
        <span class="value" id="modelValue">loading</span>
      </div>
      <div class="pill" id="pillHand" data-state="off">
        <span class="dot"></span>
        <span class="label">Hand</span>
        <span class="value" id="handValue">none</span>
      </div>
      <div class="pill" id="pillTool" data-state="off">
        <span class="dot"></span>
        <span class="label">Mode</span>
        <span class="value" id="toolValue">idle · open palm</span>
      </div>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="main">

    <!-- Camera + drawing stage. Three stacked layers:
         1. <video>        live mirrored feed
         2. #drawCanvas    permanent strokes (never cleared per-frame)
         3. #cursorCanvas  transient reticle (cleared every frame) -->
    <div class="stage" id="stage">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="drawCanvas"></canvas>
      <canvas id="cursorCanvas"></canvas>

      <div class="brackets" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="scanline" aria-hidden="true"></div>

      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="spinner" id="overlaySpinner"></div>
          <h2 id="overlayTitle">Starting up…</h2>
          <p id="overlayText">Allow webcam access to begin.</p>
        </div>
      </div>
    </div>

    <!-- Palette dock (collapses to a horizontal strip under 820px) -->
    <aside class="palette glass" id="palette" aria-label="Color palette">
      <button class="swatch" data-color="#ff4d4d" style="--sw:#ff4d4d" aria-label="Red"></button>
      <button class="swatch" data-color="#ff9f43" style="--sw:#ff9f43" aria-label="Orange"></button>
      <button class="swatch" data-color="#ffd93d" style="--sw:#ffd93d" aria-label="Yellow"></button>
      <button class="swatch" data-color="#3ddc84" style="--sw:#3ddc84" aria-label="Green"></button>
      <button class="swatch" data-color="#3b82f6" style="--sw:#3b82f6" aria-label="Blue"></button>
      <button class="swatch" data-color="#a855f7" style="--sw:#a855f7" aria-label="Purple"></button>
      <button class="swatch" data-color="#ff6bcb" style="--sw:#ff6bcb" aria-label="Pink"></button>
      <button class="swatch active" data-color="#ffffff" style="--sw:#ffffff" aria-label="White"></button>
    </aside>
  </main>

  <!-- ================= CONTROL BAR ================= -->
  <footer class="controlbar glass">
    <div class="control">
      <span class="ctrl-label">Tool</span>
      <div class="segmented" id="toolSelector" role="group" aria-label="Drawing tool">
        <button class="seg active" data-tool="pen" type="button">Pen</button>
        <button class="seg" data-tool="flower" type="button">Flower</button>
      </div>
    </div>

    <div class="control">
      <span class="ctrl-label">Camera</span>
      <select id="cameraSelect" class="camera-select" aria-label="Select camera">
        <option value="">Default</option>
      </select>
    </div>

    <div class="control">
      <span class="ctrl-label">Draw</span>
      <button class="switch on" id="drawToggle" type="button" role="switch" aria-checked="true" aria-label="Drawing on or off">
        <span class="knob"></span>
      </button>
    </div>

    <div class="control grow">
      <span class="ctrl-label">Brush <em id="brushValue">8</em></span>
      <input type="range" id="brushSlider" min="2" max="40" step="1" value="8" aria-label="Brush size" />
    </div>

    <div class="control">
      <button class="btn-ghost" id="clearBtn" type="button">Clear</button>
    </div>
  </footer>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
